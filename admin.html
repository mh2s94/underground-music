<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Admin — UNDERGROUND</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#303030;--red:#bd2029;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f3f3;font:15px/1.5 Arial,sans-serif}.wrap{width:min(1000px,92%);margin:32px auto}.brand{font-weight:1000;font-size:25px;letter-spacing:-1px}.brand span{color:var(--red)}h1{font-size:28px;margin:25px 0 6px}p,.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);padding:22px;margin:18px 0;border-radius:4px}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;color:#bbb}input,textarea,select{width:100%;background:#090909;color:white;border:1px solid #444;padding:12px;font:inherit;border-radius:2px}textarea{min-height:120px;resize:vertical}button,.btn{background:var(--red);color:white;border:0;padding:12px 17px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:inline-block;text-decoration:none;margin:12px 8px 0 0}button.secondary{background:#333}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none!important}.msg{padding:10px;background:#242424;margin-top:12px;white-space:pre-wrap}.item{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.item small{color:var(--muted)}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{margin:20px auto}.panel{padding:15px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="wrap"><a class="brand" href="/">UNDER<span>GROUND.</span></a><h1>Editorial Control Room</h1><p>Draft, generate, review and publish underground music coverage.</p>
<section id="login" class="panel"><h2>Admin sign in</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Sign in</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b>New article</b><button class="secondary" id="logoutBtn">Sign out</button></div>
<div class="row"><div><label>Band / artist</label><input id="band" placeholder="Band name"></div><div><label>Song / album title</label><input id="album" placeholder="e.g. Kingslayer"></div></div>
<div class="row"><div><label>Genre</label><select id="genre"><option>Metalcore</option><option>Hardcore</option><option>Deathcore</option><option>Darkcore</option><option>Post-Hardcore</option><option>Black Metal</option><option>Djent</option><option>Underground</option></select></div><div><label>Article category</label><input id="category" placeholder="News, Review, Interview..." value="Review"></div></div>
<label>Extra notes (optional)</label><textarea id="notes" placeholder="Optional: facts, angle or details you want the AI to include"></textarea>
<button id="generateBtn">Generate English draft with AI</button><div id="aiMsg" class="msg hidden"></div>
<label>Article title</label><input id="title" placeholder="Article headline">
<label>URL slug</label><input id="slug" placeholder="article-url-slug">
<label>Short excerpt</label><textarea id="excerpt" style="min-height:70px"></textarea>
<label>Article body (English)</label><textarea id="content" style="min-height:320px"></textarea>
<label>YouTube URL</label><input id="youtube" placeholder="https://www.youtube.com/watch?v=..."><div id="ytInfo" class="muted" style="font-size:13px;margin-top:4px"></div>
<div class="row"><div><label>Cover image URL (optional)</label><input id="cover" placeholder="https://..."></div><div><label>Tags (comma separated)</label><input id="tags" placeholder="new release, review, underground"></div></div>
<label>Status</label><select id="status"><option value="draft">Draft</option><option value="review">Needs review</option><option value="published">Publish now</option></select>
<button id="saveBtn">Save article</button><div id="saveMsg" class="msg hidden"></div></div>
<div class="panel"><h2>Articles</h2><div id="articles">Loading…</div></div></section></main>
<script>
const SB_URL="https://lhhmzfwjznlwkentbakv.supabase.co";
const SB_KEY="sb_publishable_MQDqmSmPb3qiSODbBOSKmA_U7aBEFtN";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
function msg(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
function slugify(s){return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function session(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data:admin,error}=await sb.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!admin){await sb.auth.signOut();$('login').classList.remove('hidden');$('app').classList.add('hidden');msg('loginMsg','This account is not enabled as an administrator.');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');loadArticles()}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg('loginMsg',error.message);else session()};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session()};
$('title').oninput=()=>{if(!$('slug').dataset.edited)$('slug').value=slugify($('title').value)};
$('slug').oninput=()=>{$('slug').dataset.edited='1'};
$('generateBtn').onclick=async()=>{const {data:{session:s}}=await sb.auth.getSession();if(!s)return;if(!$('band').value.trim()){msg('aiMsg','Fill in the band / artist first.');return}const btn=$('generateBtn');btn.disabled=true;msg('aiMsg','Generating article and finding the YouTube video… (up to 1 minute)');const body=JSON.stringify({band:$('band').value,album:$('album').value,genre:$('genre').value,category:$('category').value,notes:$('notes').value});const call=()=>fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body});try{let r;try{r=await call()}catch(netErr){msg('aiMsg','Connection dropped, retrying…');r=await call()}const j=await r.json().catch(()=>({error:'Server returned an unexpected response (HTTP '+r.status+'). Try again.'}));if(!r.ok){const detail=Array.isArray(j.attempts)?'\n'+j.attempts.map(x=>x.provider+': '+x.reason).join('\n'):'';throw new Error((j.error||'Generation failed')+detail)}$('title').value=j.title||'';$('slug').value=slugify(j.title||'');delete $('slug').dataset.edited;$('excerpt').value=j.excerpt||'';$('content').value=j.content||'';if(Array.isArray(j.tags)&&j.tags.length)$('tags').value=j.tags.join(', ');if(j.genre&&[...$('genre').options].some(o=>o.value===j.genre))$('genre').value=j.genre;$('youtube').value=j.youtube_url||'';if(j.cover_image_url)$('cover').value=j.cover_image_url;$('ytInfo').innerHTML=j.youtube_url?'Found: '+escapeHtml(j.youtube_title||j.youtube_url)+' — <a href="'+escapeHtml(j.youtube_url)+'" target="_blank" rel="noopener" style="color:#e55">check video</a>':'No video found automatically. <a href="'+escapeHtml(j.youtube_search_url||'#')+'" target="_blank" rel="noopener" style="color:#e55">Search YouTube</a> and paste the link.';msg('aiMsg','Article generated by '+(j.provider||'AI')+' ('+(j.model||'model')+'). Review it, check the video, then save.')}catch(e){msg('aiMsg',e.message==='Failed to fetch'?'Network error: could not reach the server. Check your connection and try again.':e.message)}finally{btn.disabled=false}};
$('saveBtn').onclick=async()=>{const {data:{session:s}}=await sb.auth.getSession();if(!s)return;const title=$('title').value.trim();if(!title||!$('content').value.trim()){msg('saveMsg','Title and article body are required.');return}const {data:cat}=await sb.from('categories').select('id').eq('slug',slugify($('genre').value)).maybeSingle();const status=$('status').value;const yt=$('youtube').value.trim();let body=$('content').value.trim();if(yt&&!body.includes(yt))body+='\n\n'+yt;const payload={title,slug:$('slug').value.trim()||slugify(title),excerpt:$('excerpt').value,content:body,band_name:$('band').value,album_name:$('album').value,genre:$('genre').value,category_id:cat?.id||null,cover_image_url:$('cover').value||null,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),status,author_id:s.user.id,published_at:status==='published'?new Date().toISOString():null,updated_at:new Date().toISOString()};const {error}=await sb.from('articles').insert(payload);if(error)msg('saveMsg',error.message);else{msg('saveMsg','Article saved.');loadArticles()}};
async function loadArticles(){const {data,error}=await sb.from('articles').select('id,title,status,created_at').order('created_at',{ascending:false}).limit(30);if(error){$('articles').textContent=error.message;return}$('articles').innerHTML=data.length?data.map(a=>'<div class="item"><div><b>'+escapeHtml(a.title)+'</b><br><small>'+a.status+' · '+new Date(a.created_at).toLocaleDateString()+'</small></div><button class="secondary" data-del="'+a.id+'">Delete</button></div>').join(''):'No articles yet.';$('articles').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this article?'))return;const {error}=await sb.from('articles').delete().eq('id',b.dataset.del);if(error)alert(error.message);else loadArticles()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
sb.auth.onAuthStateChange(()=>setTimeout(session,0));session();
</script></body></html>
