# Temporary (removed before review): resolve the version behind @supabase/supabase-js@2 and its SRI hash.
name: tmp resolve supabase-js
on:
  push:
    branches: [final-foundation]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -sS -D h.txt -o alias.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
          V=$(grep -i '^x-jsd-version:' h.txt | tr -d '\r' | awk '{print $2}'); echo "VERSION $V"
          grep -i '^content-type\|^access-control-allow-origin' h.txt
          curl -sS "https://data.jsdelivr.com/v1/packages/npm/@supabase/supabase-js@$V/entrypoints" ; echo
          for f in dist/umd/supabase.js dist/umd/supabase.min.js; do
            curl -sS -o f.js "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@$V/$f"
            echo "FILE $f bytes $(wc -c < f.js) same-as-alias $(cmp -s f.js alias.js && echo yes || echo no) sha384-$(openssl dgst -sha384 -binary f.js | openssl base64 -A)"
          done
          echo "ALIAS bytes $(wc -c < alias.js) sha384-$(openssl dgst -sha384 -binary alias.js | openssl base64 -A)"
          head -c 300 alias.js; echo
