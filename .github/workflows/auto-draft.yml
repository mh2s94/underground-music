# Every morning the AI writes 2 drafts from the newest Scene Radar headlines.
# Nothing is published automatically: review them in admin → Articles.
name: Daily AI drafts

on:
  schedule:
    - cron: "43 21 * * *"   # 06:43 in Jayapura (WIT, UTC+9)
  workflow_dispatch:         # "Run workflow" button for a manual run

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the site to write today's drafts
        env:
          TOKEN: ${{ secrets.AUTODRAFT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "AUTODRAFT_TOKEN secret is missing"; exit 1; fi
          for attempt in 1 2; do
            code=$(curl -sS -o out.json -w "%{http_code}" --max-time 280 -X POST \
              -H "Authorization: Bearer $TOKEN" https://music.mikasa.me/api/auto-draft) || code=000
            cat out.json || true; echo; echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          exit 1
