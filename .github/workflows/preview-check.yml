# Verifies the Cloudflare Pages preview of a pull request: build output, _routes.json, middleware,
# security headers, static files and API endpoints. Read-only: it only sends GET/HEAD and unauthenticated
# POST requests that every endpoint rejects. Does not touch production data or settings.
name: Preview check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  checks: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RSS publisher safety tests
        run: node tests/news-publisher.test.mjs
      - name: AI publisher validation, idempotency and RLS tests
        run: node tests/ai-publisher.test.mjs
      - name: Theme edge tests (middleware, cache, last good, timeouts)
        run: node tests/theme-edge.test.mjs
      - name: supabase-js pinned version + SRI hash
        run: node tests/supabase-js-pin.test.mjs
      - name: Theme catalogue and theme files (scoping, tokens, contrast, budget, ASSET_REV)
        run: node tests/themes.test.mjs
      - name: Basement Radio cuts (trim math, admin saves only trim columns)
        run: node tests/trim.test.mjs
      - name: Bug fixes (unsubscribe, newsletter retry, broken URLs, reader shares, band 404, markdown links)
        run: node tests/bugfixes.test.mjs
      - name: Glitch Wave branding (header, splash, launch, favicon on every page)
        run: node tests/branding.test.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Wait for the Cloudflare Pages preview of this commit
        id: cf
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq '.check_runs[] | select(.name=="Cloudflare Pages") | [.status, .conclusion, .output.summary] | @json' | head -1)
            st=$(echo "$run" | jq -r '.[0] // ""' 2>/dev/null); co=$(echo "$run" | jq -r '.[1] // ""' 2>/dev/null)
            if [ "$st" = completed ]; then
              [ "$co" = success ] || { echo "Cloudflare build: $co"; exit 1; }
              url=$(echo "$run" | jq -r '.[2]' | grep -o "https://[0-9a-f]\{8\}\.[a-z0-9-]*\.pages\.dev" | head -1)
              echo "url=$url" >> "$GITHUB_OUTPUT"; echo "Preview: $url"; exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages"; exit 1
      - name: Verify the deployment
        # Baseline: preview of branch theme-engine (same code without the middleware, same preview
        # environment). Used only to explain differences from production caused by missing preview secrets.
        run: bash .github/scripts/verify-preview.sh "${{ steps.cf.outputs.url }}" https://music.mikasa.me https://theme-engine.underground-music.pages.dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser check (supabase-js with SRI loads, app starts)
        run: |
          mkdir -p /tmp/bc && cd /tmp/bc && npm init -y >/dev/null && npm i --silent playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/.github/scripts/browser-check.mjs" /tmp/bc/ && node /tmp/bc/browser-check.mjs "${{ steps.cf.outputs.url }}"
      - name: Every theme in a real browser (switched in the page only, nothing saved)
        run: cp "$GITHUB_WORKSPACE/.github/scripts/themes-check.mjs" /tmp/bc/ && node /tmp/bc/themes-check.mjs "${{ steps.cf.outputs.url }}"
